name: Deploy Hubot to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: hubot-rg
  LOCATION: eastus

jobs:
  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name hubot-rg \
              --location eastus

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: hubot-rg
          template: ./azuredeploy.bicep
          parameters: >-
            siteName=hubot-discord
            pricingTier=Free
            enableAlwaysOn=false
            storageAccountName=hubotst
            storageAccountType=Standard_LRS
            discordBotToken=${{ secrets.DISCORD_TOKEN }}
            hubotName=hubot-discord
            repoUrl=https://github.com/maju6406/hubot-azure-discord.git
            branch=main
          failOnStdErr: false

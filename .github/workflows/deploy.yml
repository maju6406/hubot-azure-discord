name: Deploy Hubot to Azure

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: hubot-rg
  LOCATION: eastus

jobs:
  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name hubot-rg \
              --location eastus

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: hubot-rg
          template: ./azuredeploy.bicep
          parameters: >-
            siteName=hubot-discord
            pricingTier=Free
            enableAlwaysOn=false
            storageAccountName=hubotst
            storageAccountType=Standard_LRS
            discordBotToken=${{ secrets.DISCORD_TOKEN }}
            hubotName=hubot-discord
            --verbose
          failOnStdErr: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --production

      - name: Deploy code to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: hubot-discord
          package: .

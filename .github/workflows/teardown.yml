name: Teardown Azure Resources

on:
  workflow_dispatch:

jobs:
  teardown:
    name: Delete Azure Resource Group
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group delete \
              --name hubot-rg \
              --yes \
              --no-wait
